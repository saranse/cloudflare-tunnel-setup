<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Cloudflare Tunnel: เส้นทางคำขอเข้าเว็บภายใน</title>
  <desc id="desc">แผนภาพภาษาไทยแสดงผู้ใช้เชื่อมต่อผ่าน HTTPS ไปยัง Cloudflare Edge จากนั้นส่งคำขอผ่าน Tunnel ที่ cloudflared เชื่อมออกไป และเลือกเว็บภายในตาม ingress ก่อนส่งคำตอบกลับ</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf4fc"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff5ec"/><stop offset="1" stop-color="#ffe5cf"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2efff"/><stop offset="1" stop-color="#e6e0ff"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9faf4"/><stop offset="1" stop-color="#d3f4e8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#183153" flood-opacity=".09"/></filter>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#1769e0"/></marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#07966d"/></marker>
    <marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#ee7a24"/></marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&amp;display=swap');
      text{font-family:"Noto Sans Thai","Leelawadee UI",Tahoma,Arial,sans-serif;fill:#152b49}
      .overline{font-size:14px;font-weight:800;letter-spacing:2.5px;fill:#56708d}
      .title{font-size:42px;font-weight:800;letter-spacing:-.4px}
      .subtitle{font-size:19px;font-weight:400;fill:#586f89}
      .zoneTitle{font-size:15px;font-weight:800;letter-spacing:1.8px;fill:#526b88}
      .cardTitle{font-size:23px;font-weight:800}
      .cardSub{font-size:16px;font-weight:500;fill:#5b718b}
      .body{font-size:16px;font-weight:500;fill:#506781}
      .mini{font-size:14px;font-weight:600;fill:#49617e}
      .step{font-size:16px;font-weight:800;fill:#fff}
      .stepNote{font-size:15px;font-weight:700}
      .serviceTitle{font-size:16px;font-weight:750}
      .serviceSub{font-size:13px;font-weight:500;fill:#60758c}
      .footerTitle{font-size:18px;font-weight:800;fill:#fff}
      .footerText{font-size:15px;font-weight:500;fill:#d7e3f1}
    </style>
  </defs>
  <rect width="1600" height="980" rx="30" fill="url(#bg)"/>
  <circle cx="1510" cy="40" r="170" fill="#e2edff" opacity=".5"/>
  <circle cx="60" cy="930" r="145" fill="#dcf5ed" opacity=".5"/>

  <!-- Header -->
  <text x="76" y="61" class="overline">NETWORK FLOW · 4 ขั้นตอน</text>
  <text x="74" y="116" class="title">Cloudflare Tunnel ทำงานอย่างไร</text>
  <text x="77" y="152" class="subtitle">เปิดเว็บภายในผ่านโดเมน โดยให้เซิร์ฟเวอร์เป็นฝ่ายเชื่อมต่อออกไปหา Cloudflare</text>

  <!-- Network boundaries -->
  <rect x="62" y="214" width="338" height="520" rx="26" fill="#fff" stroke="#b8cce3" stroke-width="2"/>
  <rect x="452" y="214" width="330" height="520" rx="26" fill="#fff" stroke="#b8cce3" stroke-width="2"/>
  <rect x="834" y="214" width="704" height="520" rx="26" fill="#f7fbff" stroke="#8daecc" stroke-width="2" stroke-dasharray="10 9"/>
  <rect x="1025" y="193" width="320" height="42" rx="14" fill="#dfeafa"/>
  <text x="1185" y="221" text-anchor="middle" class="zoneTitle">DATA CENTER / PRIVATE NETWORK</text>
  <text x="231" y="251" text-anchor="middle" class="zoneTitle">อุปกรณ์ผู้ใช้</text>
  <text x="617" y="251" text-anchor="middle" class="zoneTitle">CLOUDFLARE EDGE</text>

  <!-- Main cards -->
  <rect x="91" y="294" width="280" height="330" rx="24" fill="#fff" stroke="#d8e4f1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="487" y="294" width="260" height="330" rx="24" fill="#fff" stroke="#d8e4f1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="868" y="294" width="245" height="330" rx="24" fill="#fff" stroke="#d8e4f1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1150" y="294" width="350" height="330" rx="24" fill="#fff" stroke="#d8e4f1" stroke-width="2" filter="url(#shadow)"/>

  <!-- Browser icon -->
  <circle cx="231" cy="365" r="43" fill="#eaf2ff"/>
  <rect x="207" y="348" width="48" height="34" rx="5" fill="none" stroke="#1769e0" stroke-width="4"/>
  <path d="M199 390h64l-7 8h-50zM231 382v8" fill="#1769e0"/>
  <text x="231" y="452" text-anchor="middle" class="cardTitle">ผู้ใช้ / Browser</text>
  <text x="231" y="483" text-anchor="middle" class="cardSub">เปิดโดเมนเว็บไซต์</text>
  <rect x="119" y="534" width="224" height="52" rx="15" fill="#f0f5ff"/>
  <text x="231" y="566" text-anchor="middle" class="mini">HTTPS · app.example.com</text>

  <!-- Cloudflare icon -->
  <circle cx="617" cy="365" r="43" fill="url(#orange)"/>
  <path d="M584 374c0-11 9-18 20-18 4-15 24-19 35-8 14-3 26 7 26 20 8 2 13 8 13 15h-98c-9 0-15-4-15-9z" fill="none" stroke="#e97821" stroke-width="4" stroke-linejoin="round"/>
  <text x="617" y="452" text-anchor="middle" class="cardTitle">Cloudflare</text>
  <text x="617" y="483" text-anchor="middle" class="cardSub">DNS · Proxy · WAF*</text>
  <rect x="514" y="534" width="206" height="52" rx="15" fill="#fff5ed"/>
  <text x="617" y="566" text-anchor="middle" class="mini">รับ HTTPS แล้วหา Tunnel</text>

  <!-- cloudflared icon -->
  <circle cx="990" cy="365" r="43" fill="url(#purple)"/>
  <path d="M969 366a21 21 0 0 1 39-11m-5-10 8 9-12 2M1011 364a21 21 0 0 1-39 11m5 10-8-9 12-2" fill="none" stroke="#7155df" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="990" y="452" text-anchor="middle" class="cardTitle">cloudflared</text>
  <text x="990" y="483" text-anchor="middle" class="cardSub">Tunnel Connector</text>
  <rect x="898" y="534" width="184" height="52" rx="15" fill="#f4f1ff"/>
  <text x="990" y="566" text-anchor="middle" class="mini">อ่าน ingress config</text>

  <!-- Internal services -->
  <circle cx="1325" cy="358" r="37" fill="url(#green)"/>
  <rect x="1306" y="340" width="38" height="36" rx="5" fill="none" stroke="#07966d" stroke-width="3.5"/>
  <path d="M1306 351h38m-29-6h2m6 0h2m6 0h2m-16 14h19m-19 7h19" stroke="#07966d" stroke-width="2.6" stroke-linecap="round"/>
  <text x="1325" y="420" text-anchor="middle" class="cardTitle">เว็บและบริการภายใน</text>
  <text x="1325" y="448" text-anchor="middle" class="cardSub">เลือกปลายทางตาม hostname / ingress</text>
  <rect x="1180" y="478" width="290" height="35" rx="10" fill="#f0f6ff"/>
  <text x="1200" y="501" class="serviceTitle">Issue Tracking</text><text x="1450" y="501" text-anchor="end" class="serviceSub">10.0.1.20:8080</text>
  <rect x="1180" y="521" width="290" height="35" rx="10" fill="#f0f6ff"/>
  <text x="1200" y="544" class="serviceTitle">Intranet Site</text><text x="1450" y="544" text-anchor="end" class="serviceSub">10.0.1.30:80</text>
  <rect x="1180" y="564" width="290" height="35" rx="10" fill="#f0f6ff"/>
  <text x="1200" y="587" class="serviceTitle">Internal API / Tool</text><text x="1450" y="587" text-anchor="end" class="serviceSub">127.0.0.1:3000</text>

  <!-- Request flow arrows 1-3 -->
  <path d="M371 409h108" fill="none" stroke="#1769e0" stroke-width="6" marker-end="url(#blueArrow)"/>
  <circle cx="426" cy="376" r="19" fill="#1769e0"/><text x="426" y="382" text-anchor="middle" class="step">1</text>
  <path d="M747 409h112" fill="none" stroke="#1769e0" stroke-width="6" marker-end="url(#blueArrow)"/>
  <circle cx="803" cy="376" r="19" fill="#1769e0"/><text x="803" y="382" text-anchor="middle" class="step">2</text>
  <path d="M1113 409h28" fill="none" stroke="#07966d" stroke-width="6" marker-end="url(#greenArrow)"/>
  <circle cx="1127" cy="376" r="19" fill="#07966d"/><text x="1127" y="382" text-anchor="middle" class="step">3</text>

  <!-- Outbound tunnel connection -->
  <path d="M990 294 C970 265 858 265 770 294" fill="none" stroke="#ee7a24" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#orangeArrow)"/>
  <rect x="774" y="249" width="210" height="34" rx="12" fill="#fff1e4"/>
  <text x="879" y="272" text-anchor="middle" font-size="14" font-weight="750" fill="#a74d0a">Tunnel เปิดจาก Server ออกไป</text>

  <!-- Response path -->
  <path d="M1325 624v63H231v-63" fill="none" stroke="#07966d" stroke-width="4" marker-end="url(#greenArrow)"/>
  <circle cx="774" cy="687" r="19" fill="#07966d"/><text x="774" y="693" text-anchor="middle" class="step">4</text>
  <rect x="635" y="704" width="278" height="34" rx="12" fill="#e6f8f1"/>
  <text x="774" y="727" text-anchor="middle" class="stepNote" fill="#047857">ส่งคำตอบกลับผ่าน Tunnel เดิม</text>

  <!-- Explanation footer -->
  <rect x="62" y="778" width="1476" height="132" rx="24" fill="#142642"/>
  <circle cx="118" cy="844" r="23" fill="#10a879"/>
  <path d="m107 844 8 8 15-17" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="160" y="825" class="footerTitle">ไม่ต้องเปิดพอร์ตขาเข้าที่ Server</text>
  <text x="160" y="856" class="footerText">cloudflared เป็นฝ่ายเชื่อมออกไปหา Cloudflare; คำขอและคำตอบวิ่งผ่าน Tunnel ที่เชื่อมไว้นี้</text>
  <text x="160" y="882" class="footerText">* WAF ทำงานเมื่อเปิดใช้ · ingress กำหนดว่าแต่ละ hostname จะไปยังบริการภายในตัวใด</text>
  <text x="1520" y="947" text-anchor="end" font-size="14" font-weight="600" fill="#71849d">1 ผู้ใช้ → 2 Cloudflare → 3 บริการภายใน → 4 คำตอบกลับ</text>
</svg>
