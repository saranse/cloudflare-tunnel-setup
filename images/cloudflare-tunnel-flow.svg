<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Cloudflare Tunnel: request flow</title>
  <desc id="desc">A polished Thai diagram showing a browser request passing through Cloudflare and an outbound Cloudflare Tunnel to an internal origin, then returning through the same tunnel.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#eef4fb"/></linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1e6"/><stop offset="1" stop-color="#ffdfc6"/></linearGradient>
    <linearGradient id="tunnel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eee9ff"/><stop offset="1" stop-color="#ddd5ff"/></linearGradient>
    <linearGradient id="origin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5f8f2"/><stop offset="1" stop-color="#c8f0e2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="155%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#183153" flood-opacity=".10"/></filter>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#2563eb"/></marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#059669"/></marker>
    <marker id="purpleArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#7c3aed"/></marker>
    <style>
      text{font-family:"Sukhumvit Set","Noto Sans Thai","Leelawadee UI",Tahoma,Arial,sans-serif;fill:#172b4d}
      .eyebrow{font-size:15px;font-weight:800;letter-spacing:2.6px;fill:#54708e}
      .heading{font-size:43px;font-weight:800;letter-spacing:-.7px}
      .subtitle{font-size:20px;font-weight:400;fill:#5c7089}
      .zone{font-size:15px;font-weight:800;letter-spacing:1.7px;fill:#607590}
      .cardTitle{font-size:25px;font-weight:750}
      .cardSub{font-size:16px;font-weight:500;fill:#607590}
      .body{font-size:17px;font-weight:450;fill:#50657e}
      .mini{font-size:15px;font-weight:600;fill:#526984}
      .step{font-size:17px;font-weight:800;fill:#fff}
      .returnLabel{font-size:16px;font-weight:750;fill:#047857}
      .noteTitle{font-size:19px;font-weight:800;fill:#fff}
      .noteBody{font-size:16px;font-weight:450;fill:#d5e2f2}
    </style>
  </defs>

  <rect width="1600" height="960" rx="32" fill="url(#canvas)"/>
  <circle cx="1480" cy="72" r="190" fill="#e0ebff" opacity=".55"/>
  <circle cx="45" cy="900" r="170" fill="#d8f5ec" opacity=".42"/>

  <text x="82" y="65" class="eyebrow">HOW IT WORKS</text>
  <text x="80" y="119" class="heading">Cloudflare Tunnel</text>
  <text x="82" y="157" class="subtitle">รับคำขอจากอินเทอร์เน็ต แล้วส่งเข้าเว็บภายในผ่านการเชื่อมต่อที่เซิร์ฟเวอร์เปิดออกไป</text>

  <!-- Zones -->
  <text x="225" y="226" text-anchor="middle" class="zone">ผู้เข้าชม</text>
  <text x="625" y="226" text-anchor="middle" class="zone">CLOUDFLARE NETWORK</text>
  <rect x="865" y="199" width="655" height="505" rx="30" fill="#f7fbff" stroke="#a9bdd4" stroke-width="2" stroke-dasharray="9 9"/>
  <rect x="1045" y="178" width="300" height="43" rx="14" fill="#dce9f8"/>
  <text x="1195" y="206" text-anchor="middle" class="zone">เครือข่ายเซิร์ฟเวอร์ของคุณ</text>

  <!-- Cards -->
  <rect x="75" y="268" width="300" height="330" rx="26" fill="#fff" stroke="#dce6f1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="475" y="268" width="300" height="330" rx="26" fill="#fff" stroke="#dce6f1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="900" y="268" width="280" height="330" rx="26" fill="#fff" stroke="#dce6f1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1210" y="268" width="280" height="330" rx="26" fill="#fff" stroke="#dce6f1" stroke-width="2" filter="url(#shadow)"/>

  <!-- Browser icon -->
  <circle cx="225" cy="348" r="43" fill="#e9f1ff"/>
  <rect x="202" y="331" width="46" height="34" rx="5" fill="none" stroke="#2563eb" stroke-width="4"/>
  <path d="M194 374h62l-7 8h-48zM225 365v9" fill="#2563eb"/>
  <text x="225" y="438" text-anchor="middle" class="cardTitle">ผู้ใช้ / Browser</text>
  <text x="225" y="469" text-anchor="middle" class="cardSub">เปิดโดเมนของเว็บไซต์</text>
  <rect x="108" y="512" width="234" height="52" rx="15" fill="#f0f5ff"/>
  <text x="225" y="544" text-anchor="middle" class="mini">HTTPS · app.example.com</text>

  <!-- Cloudflare icon -->
  <circle cx="625" cy="348" r="43" fill="url(#cloud)"/>
  <path d="M594 357c0-10 8-17 19-17 4-14 24-18 34-7 14-3 25 6 25 19 8 2 13 8 13 15h-91c-8 0-14-4-14-10z" fill="none" stroke="#ea580c" stroke-width="4" stroke-linejoin="round"/>
  <text x="625" y="438" text-anchor="middle" class="cardTitle">Cloudflare Edge</text>
  <text x="625" y="469" text-anchor="middle" class="cardSub">DNS · Proxy · WAF</text>
  <rect x="508" y="512" width="234" height="52" rx="15" fill="#fff5ed"/>
  <text x="625" y="544" text-anchor="middle" class="mini">หา Tunnel ของ hostname นี้</text>

  <!-- Connector icon -->
  <circle cx="1040" cy="348" r="43" fill="url(#tunnel)"/>
  <path d="M1019 350a21 21 0 0 1 39-11m-5-10 8 9-12 2M1061 346a21 21 0 0 1-39 11m5 10-8-9 12-2" fill="none" stroke="#6d4be8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1040" y="438" text-anchor="middle" class="cardTitle">cloudflared</text>
  <text x="1040" y="469" text-anchor="middle" class="cardSub">Tunnel Connector</text>
  <rect x="933" y="512" width="214" height="52" rx="15" fill="#f4f1ff"/>
  <text x="1040" y="544" text-anchor="middle" class="mini">เลือกปลายทางจาก ingress</text>

  <!-- Origin icon -->
  <circle cx="1350" cy="348" r="43" fill="url(#origin)"/>
  <rect x="1328" y="327" width="44" height="42" rx="5" fill="none" stroke="#059669" stroke-width="4"/>
  <path d="M1328 340h44m-32-7h2m7 0h2m7 0h2m-18 16h22m-22 8h22" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <text x="1350" y="438" text-anchor="middle" class="cardTitle">เว็บ / แอปภายใน</text>
  <text x="1350" y="469" text-anchor="middle" class="cardSub">Origin service</text>
  <rect x="1238" y="512" width="224" height="52" rx="15" fill="#eaf9f3"/>
  <text x="1350" y="544" text-anchor="middle" class="mini">http://127.0.0.1:80</text>

  <!-- Request arrows -->
  <path d="M375 390h95" fill="none" stroke="#2563eb" stroke-width="6" marker-end="url(#blueArrow)"/>
  <circle cx="423" cy="356" r="19" fill="#2563eb"/><text x="423" y="362" text-anchor="middle" class="step">1</text>
  <path d="M775 390h115" fill="none" stroke="#2563eb" stroke-width="6" marker-end="url(#blueArrow)"/>
  <circle cx="832" cy="356" r="19" fill="#2563eb"/><text x="832" y="362" text-anchor="middle" class="step">2</text>
  <path d="M1180 390h25" fill="none" stroke="#059669" stroke-width="6" marker-end="url(#greenArrow)"/>
  <circle cx="1192" cy="356" r="19" fill="#059669"/><text x="1192" y="362" text-anchor="middle" class="step">3</text>

  <!-- Outbound tunnel link, separate from request path -->
  <path d="M1040 268 C965 208 760 208 625 268" fill="none" stroke="#7c3aed" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#purpleArrow)"/>
  <rect x="730" y="226" width="222" height="34" rx="12" fill="#efeaff"/>
  <text x="841" y="249" text-anchor="middle" font-size="14" font-weight="750" fill="#6d28d9">Tunnel เชื่อมออกไปหา Cloudflare</text>

  <!-- Response path -->
  <path d="M1350 598v74H225v-74" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#greenArrow)"/>
  <circle cx="790" cy="672" r="19" fill="#059669"/><text x="790" y="678" text-anchor="middle" class="step">4</text>
  <rect x="657" y="691" width="266" height="34" rx="12" fill="#e6f7f1"/>
  <text x="790" y="714" text-anchor="middle" class="returnLabel">ส่งคำตอบกลับทาง Tunnel เดิม</text>

  <!-- Summary -->
  <rect x="75" y="774" width="1450" height="112" rx="25" fill="#14243d"/>
  <circle cx="131" cy="830" r="23" fill="#10b981"/>
  <path d="m120 830 8 8 15-17" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="176" y="820" class="noteTitle">ไม่ต้องเปิดพอร์ตขาเข้าจากอินเทอร์เน็ต</text>
  <text x="176" y="852" class="noteBody">เครื่องที่รัน cloudflared ต้องเชื่อมต่อออกไปยัง Cloudflare ได้ ส่วน origin ระบุใน ingress เช่น http://127.0.0.1:80</text>
  <text x="1520" y="923" text-anchor="end" font-size="14" font-weight="600" fill="#71849d">1–3 คำขอเข้า · 4 ส่งคำตอบกลับ</text>
</svg>
